
#Pam's HarvestCraft 2 food rebalancing. Requires restart to take effect.
[foodNerf]
	#rebalance Pam's HarvestCraft 2 food values to 1.12.2 baseline (Thanks Pixel1011!).
	nerfPams = true
	#strip food properties from ingredient items (butter, spices, fresh water, etc.) so they cannot be eaten.
	inedibleIngredients = false
	#Rebalance vanilla Minecraft food values to Pam's 1.12.2 baseline.
	nerfMinecraft = false

#Bakeware cooking flow in the CFB cooking table.
[bakeware]
	#enable use cooldown on bakeware recipes. when false, bakeware recipes craft instantly.
	enabled = false
	#bake duration in ticks.
	#Range: 0 ~ 600
	durationTicks = 80
	#refund ingredients if the player closes the cooking table menu while a bake is in progress.
	refundOnCancel = false

#Cutting board behavior.
[cuttingBoard]
	#OP Netherite knife! Farmer's Delight netherite knife takes no durability damage when used on the cutting board.
	opNetheriteKnife = false
	#allow stacking extra items onto an occupied cutting board for multi-item cutting recipes and display.
	#when false, only vanilla Farmer's Delight single-item cutting board behavior applies.
	multiCutting = false

#Chat notifications.
[notifications]
	#show a chat message on login when certain optional dependencies are missing.
	notifyMissingDeps = false

