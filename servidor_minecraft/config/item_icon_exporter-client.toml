
[general]
	#Path to save exported images.
	#Supports absolute paths, or paths relative to the game root directory.
	savePath = "item_icon_exporter_output"
	#List of image sizes to export (Integer format, width equals height).
	#Minimum size: 16  |  Maximum size: 2048
	imageSizes = [36, 128]
	#How to handle items with enchantment glint.
	#1 = Export ONLY the unenchanted icon
	#2 = Export ONLY the enchanted icon
	#3 = Export BOTH (exports one without glint, and another with '_glint' suffix).
	#Range: 1 ~ 3
	glintExportMode = 1
	#Enable screenshot keybindings (Requires game restart if changed).
	enableKeybindings = true
	#Max items to process per tick during bulk export. Lower=smoother game, Higher=faster export.
	#Range: 1 ~ 100
	maxExportsPerTick = 10

